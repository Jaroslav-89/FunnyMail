name: V15 validation

on:
  push:
    branches:
      - feature/chat-drawing-tools-v15
  pull_request:
    branches:
      - feature/chat-drawing-tools-v14

permissions:
  contents: read

jobs:
  android-build:
    name: Android assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android release APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease

  shared-tests:
    name: Shared unit tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run multiplatform tests
        run: ./gradlew --no-daemon :shared:allTests
